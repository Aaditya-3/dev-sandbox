# services:
#   api:
#     build: .
#     ports:
#       - "8080:8000"
#     volumes:
#       - .:/app
#     depends_on:
#       - database

#   database:
#     image: postgres:15
#     environment:
#       POSTGRES_USER: admin
#       POSTGRES_PASSWORD: secretpassword
#       POSTGRES_DB: myapp_db
#     ports:
#       - "5432:5432"
#     volumes:
#       - pg_data:/var/lib/postgresql/data

# volumes:
#   pg_data:

#   services:: This block defines the different containers we want to run. We named ours api and database.

# api service:

# build: .: Tells Compose to look in the current folder, find the Dockerfile, and build it.

# ports and volumes: Exactly the same as the -p and -v flags we used in the terminal, just written in YAML format.

# depends_on: Ensures the database container starts before the FastAPI container.

# database service:

# image: postgres:15: We don't need a Dockerfile for the database. We just pull the official, pre-built PostgreSQL image directly from the internet.

# environment: Injects environment variables into the container so PostgreSQL knows what password to set on startup.

# volumes: (at the bottom): This tells Docker to create a managed volume named pg_data to safely store our database files, as we discussed earlier.


#MULTISTAGE BUILD:
FROM python:3.11-slim AS builder
WORKDIR /app

RUN apt-get update && apt-get install -y --no-install-recommends gcc libpq-dev
RUN python -m venv /opt/venv
ENV PATH="/opt/venv/bin:$PATH"

COPY requirements.txt .
RUN pip install --no-cache-dir -r requirements.txt

FROM python:3.11-slim AS runtime
WORKDIR /app

COPY --from=builder /opt/venv /opt/venv
ENV PATH="/opt/venv/bin:$PATH"

COPY . .

CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]


# 1)docker build -t my-api:v1 .	
# Builds an image from the Dockerfile in the current folder (.) and tags it.

# 2)CommandWhat it does & why it mattersdocker build -t my-api:v1 .
# Builds an image from the Dockerfile in the current folder (.) and tags it.docker run -d -p 8080:8000 --name api --env-file .env my-api:v1The real-world run command: -d runs in the background (detached), -p maps Host:Container ports, --name gives it a readable name, and --env-file injects secrets at runtime.

# 3)docker run --rm -it my-api:v1 /bin/bash	
# Boots a temporary container straight into a shell to test things. --rm automatically deletes the container the moment you exit so it doesn't clutter your machine.

# docker ps -a	
# Lists all containers—running and crashed—along with their status and exit codes (Exited (137)). Plain docker ps hides crashed containers.

# docker logs -f --tail 100 api	
# Streams live stdout/stderr logs (-f), starting from the last 100 lines so you don't flood your terminal.

# docker exec -it api /bin/bash	
# Opens a shell inside an already running container to inspect files, environment variables, or test network calls (curl). Use /bin/sh on Alpine images.

# docker compose up -d --build
# Rebuilds your images (picking up any Dockerfile or requirements.txt changes) and starts all services in the background.

# docker compose logs -f api
# Follows logs for one specific service instead of interleaving Postgres and FastAPI logs together.

# docker compose down
# Stops and removes all containers and the custom network created by Compose, while keeping your database volumes safe.

# docker rm -f api
# Force-stops and deletes a container in one command (great locally; avoid -f in production since it sends SIGKILL instead of graceful SIGTERM).

# docker system prune -a
# Deletes all stopped containers, unused networks, dangling build cache, and unused images. Run this when Docker eats 20+ GB of your laptop's SSD.